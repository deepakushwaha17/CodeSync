JWT_SECRET: codesyncSuperSecretJwtKeyForTestingApplication123456789
JWT_EXPIRATION: 3600000
JWT_REFRESH_EXPIRATION: 86400000

MAIL_USERNAME: test@example.com
MAIL_PASSWORD: dummy-password

DATABASE_USERNAME: sa
DATABASE_PASSWORD: ""

GOOGLE_CLIENT_ID: dummy-google-client-id
GOOGLE_CLIENT_SECRET: dummy-google-client-secret
GITHUB_CLIENT_ID: dummy-github-client-id
GITHUB_CLIENT_SECRET: dummy-github-client-secret

REDIRECT_URI: http://localhost:8080/login/oauth2/code/
FRONTEND_URL: http://localhost:3000

debug: false

spring:
  application:
    name: auth-service

  main:
    web-application-type: servlet

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    loadbalancer:
      enabled: false
    compatibility-verifier:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.amqp.RabbitMetricsAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-client-id
            client-secret: dummy-google-client-secret
            scope:
              - email
              - profile
          github:
            client-id: dummy-github-client-id
            client-secret: dummy-github-client-secret
            scope:
              - user:email
              - read:user

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  health:
    rabbit:
      enabled: false
    mail:
      enabled: false
    discovery:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: ERROR
    org.springframework: ERROR
    org.hibernate: ERROR
    com.netflix.discovery: OFF
    org.springframework.cloud.netflix.eureka: OFF