server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # ─── AUTH SERVICE ────────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # ─── AUTH SERVICE — OAuth2 authorization initiation ──────────
        # Handles: /api/v1/auth/oauth2/authorize/github
        #          /api/v1/auth/oauth2/authorize/google
        - id: auth-service-oauth2-authorize
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/oauth2/authorize/**
          filters:
            - StripPrefix=0

        # ─── AUTH SERVICE — OAuth2 callback from provider ────────────
        # GitHub/Google redirect back to this URL after user approves
        # http://localhost:8080/api/v1/auth/oauth2/callback/github
        # http://localhost:8080/api/v1/auth/oauth2/callback/google
        - id: auth-service-oauth2-callback
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/oauth2/callback/**
          filters:
            - StripPrefix=0

        # ─── Spring Security internal OAuth2 paths ───────────────────
        # Spring Security uses /login/oauth2/code/* internally
        - id: auth-service-oauth2-login
          uri: lb://auth-service
          predicates:
            - Path=/login/oauth2/**
          filters:
            - StripPrefix=0

        # ─── OAuth2 authorization endpoint (Spring internal) ─────────
        - id: auth-service-oauth2-internal
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**
          filters:
            - StripPrefix=0

        # ─── PROJECT SERVICE ─────────────────────────────────────────
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/v1/projects/**
          filters:
            - StripPrefix=0

        # ─── FILE SERVICE ────────────────────────────────────────────
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/v1/files/**
          filters:
            - StripPrefix=0

        # ─── COLLABORATION SERVICE ───────────────────────────────────
        - id: collab-service
          uri: lb://collab-service
          predicates:
            - Path=/api/v1/sessions/**
          filters:
            - StripPrefix=0

        # ─── EXECUTION SERVICE ───────────────────────────────────────
        - id: execution-service
          uri: lb://execution-service
          predicates:
            - Path=/api/v1/executions/**
          filters:
            - StripPrefix=0

        # ─── VERSION SERVICE ─────────────────────────────────────────
        - id: version-service
          uri: lb://version-service
          predicates:
            - Path=/api/v1/versions/**
          filters:
            - StripPrefix=0

        # ─── COMMENT SERVICE ─────────────────────────────────────────
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comments/**
          filters:
            - StripPrefix=0

        # ─── NOTIFICATION SERVICE ────────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

# ─── EUREKA ──────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ─── JWT ─────────────────────────────────────────────────────────────
jwt:
  secret: codesync-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000

# ─── ACTUATOR ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.codesync.gateway: DEBUG
    reactor.netty: WARN