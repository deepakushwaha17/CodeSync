server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      # Route definitions — each route maps to a Eureka-registered service
      routes:

        # Auth Service — /auth/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        # Project Service — /projects/**
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/projects/**
          filters:
            - StripPrefix=0

        # File Service — /files/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/files/**
          filters:
            - StripPrefix=0

        # Collaboration Service — /sessions/**
        - id: collab-service
          uri: lb://collab-service
          predicates:
            - Path=/sessions/**
          filters:
            - StripPrefix=0

        # Execution Service — /executions/**
        - id: execution-service
          uri: lb://execution-service
          predicates:
            - Path=/executions/**
          filters:
            - StripPrefix=0

        # Version Service — /versions/**
        - id: version-service
          uri: lb://version-service
          predicates:
            - Path=/versions/**
          filters:
            - StripPrefix=0

        # Comment Service — /comments/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/comments/**
          filters:
            - StripPrefix=0

        # Notification Service — /notifications/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
          filters:
            - StripPrefix=0

        # Web App — everything else
        - id: codesync-web
          uri: lb://codesync-web
          predicates:
            - Path=/**
          filters:
            - StripPrefix=0

# Eureka client config
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: codesync-jwt-secret-key-must-be-at-least-32-chars

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
